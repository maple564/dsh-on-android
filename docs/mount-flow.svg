<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <rect width="900" height="330" fill="#0f172a"/>

  <!-- 手机存储 -->
  <rect x="26" y="70" width="200" height="150" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="126" y="40" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">手机存储</text>
  <text x="126" y="104" fill="#94a3b8" font-size="13" text-anchor="middle">/sdcard/Documents</text>
  <text x="126" y="132" fill="#94a3b8" font-size="13" text-anchor="middle">/sdcard/Download</text>
  <text x="126" y="170" fill="#64748b" font-size="11" text-anchor="middle">文件管理器 / 微信 / WPS</text>
  <text x="126" y="190" fill="#64748b" font-size="11" text-anchor="middle">直接打开产物</text>

  <line x1="232" y1="145" x2="292" y2="145" stroke="#4ade80" stroke-width="2" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4ade80"/>
    </marker>
  </defs>
  <text x="262" y="132" fill="#4ade80" font-size="11" text-anchor="middle">挂载</text>

  <!-- OpenMinis sandbox -->
  <rect x="300" y="46" width="270" height="238" rx="14" fill="#111c2e" stroke="#4f46e5" stroke-dasharray="6 4"/>
  <text x="435" y="72" fill="#a5b4fc" font-size="13" font-weight="600" text-anchor="middle">OpenMinis 沙箱（PRoot · Alpine）</text>

  <rect x="320" y="90" width="230" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="435" y="117" fill="#e2e8f0" font-size="12" text-anchor="middle">/var/minis/mounts/Documents</text>

  <rect x="320" y="146" width="230" height="44" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="435" y="173" fill="#e2e8f0" font-size="12" text-anchor="middle">/var/minis/mounts/Download</text>

  <rect x="320" y="202" width="230" height="60" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="435" y="226" fill="#fbbf24" font-size="12" text-anchor="middle">dsh 工作区 = 挂载目录</text>
  <text x="435" y="246" fill="#94a3b8" font-size="10" text-anchor="middle">workspace.json 里注册，别用 /root</text>

  <line x1="570" y1="145" x2="630" y2="145" stroke="#60a5fa" stroke-width="2" marker-end="url(#b)"/>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- dsh -->
  <rect x="638" y="60" width="232" height="170" rx="12" fill="#1e293b" stroke="#2563eb"/>
  <text x="754" y="90" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">DeepSeek Harness</text>
  <text x="754" y="118" fill="#94a3b8" font-size="12" text-anchor="middle">write / read / convert</text>
  <text x="754" y="146" fill="#94a3b8" font-size="12" text-anchor="middle">PPTX · PDF · ICS · 脚本</text>
  <text x="754" y="186" fill="#64748b" font-size="11" text-anchor="middle">产物写回挂载目录</text>
  <text x="754" y="206" fill="#64748b" font-size="11" text-anchor="middle">= 手机里立刻可见</text>

  <text x="450" y="312" fill="#64748b" font-size="11" text-anchor="middle">dsh-on-android · 让手机上的 Agent 真正碰到手机里的文件</text>
</svg>
